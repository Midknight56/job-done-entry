<!-- Customer payment page for a shared invoice. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pay invoice</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./customer.css">
  </head>
  <body>
    <main class="customer-view">
      <article class="card">
        <h2 id="business">Job Done</h2>
        <div id="amount" class="money"></div>
        <img id="qr" class="qr" alt="Payment QR code">
        <p id="shared" class="quiet shared-invoice" hidden>Shared invoice</p>
        <p id="payment-help" class="centered">Scan to pay with PayPal</p>
        <p id="status" class="pay-status waiting-status" role="status">Waiting for payment</p>
      </article>
    </main>
    <script type="module" src="./customer.js"></script>
  </body>
</html>
